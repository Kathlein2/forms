<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CRUD Google Sheets App</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <header>
      <h1>Data Management System</h1>
      <p>Create, view, update and delete records</p>
    </header>


    <div id="message"></div>


    <!-- FORM -->

    <section class="card">

      <h2 id="formTitle">
        Add Record
      </h2>

      <form id="recordForm">

        <input
          type="hidden"
          id="recordId"
        >

        <div class="form-grid">

          <div class="form-group">

            <label for="name">
              Name *
            </label>

            <input
              type="text"
              id="name"
              placeholder="Enter name"
              required
            >

          </div>


          <div class="form-group">

            <label for="email">
              Email
            </label>

            <input
              type="email"
              id="email"
              placeholder="Enter email"
            >

          </div>


          <div class="form-group">

            <label for="phone">
              Phone
            </label>

            <input
              type="text"
              id="phone"
              placeholder="Enter phone"
            >

          </div>


          <div class="form-group">

            <label for="status">
              Status
            </label>

            <select id="status">

              <option value="Active">
                Active
              </option>

              <option value="Inactive">
                Inactive
              </option>

              <option value="Pending">
                Pending
              </option>

            </select>

          </div>

        </div>


        <div class="buttons">

          <button
            type="submit"
            id="submitButton"
            class="btn-primary"
          >
            Add Record
          </button>

          <button
            type="button"
            class="btn-secondary"
            onclick="resetForm()"
          >
            Clear
          </button>

        </div>

      </form>

    </section>


    <!-- RECORDS -->

    <section class="card">

      <div class="toolbar">

        <div>

          <h2>
            Records
          </h2>

          <span id="recordCount">
            Loading...
          </span>

        </div>


        <input
          type="text"
          id="search"
          placeholder="Search records..."
        >

      </div>


      <div class="table-container">

        <table>

          <thead>

            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Status</th>
              <th>Created</th>
              <th>Updated</th>
              <th>Actions</th>
            </tr>

          </thead>


          <tbody id="tableBody">

            <tr>

              <td
                colspan="7"
                class="loading"
              >
                Loading records...
              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </section>

  </div>


  <script src="script.js"></script>

</body>

</html>
