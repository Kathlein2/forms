<!DOCTYPE html>
<html>
<head>
  <base target="_top">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CRUD Google Sheets App</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f9;
      color: #222;
    }

    .container {
      width: 95%;
      max-width: 1200px;
      margin: 30px auto;
    }

    .header {
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0 0 5px;
      font-size: 28px;
    }

    .header p {
      margin: 0;
      color: #777;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    label {
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 14px;
    }

    input,
    select {
      padding: 11px 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 14px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #4285f4;
      box-shadow: 0 0 0 2px rgba(66,133,244,0.1);
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      border: none;
      border-radius: 7px;
      padding: 11px 18px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn-primary {
      background: #4285f4;
      color: white;
    }

    .btn-secondary {
      background: #777;
      color: white;
    }

    .btn-edit {
      background: #fbbc04;
      color: #222;
    }

    .btn-delete {
      background: #ea4335;
      color: white;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 15px;
    }

    .toolbar h2 {
      margin: 0;
    }

    .search {
      width: 300px;
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 800px;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid #eee;
      text-align: left;
      font-size: 14px;
    }

    th {
      background: #f8f9fa;
      font-weight: bold;
    }

    tr:hover td {
      background: #fafafa;
    }

    .status {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .status-active {
      background: #d9f7df;
      color: #137333;
    }

    .status-inactive {
      background: #fce8e6;
      color: #c5221f;
    }

    .status-pending {
      background: #fff4ce;
      color: #8a5a00;
    }

    .actions {
      display: flex;
      gap: 5px;
    }

    .actions button {
      padding: 7px 10px;
      font-size: 12px;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #888;
    }

    .message {
      display: none;
      padding: 12px 15px;
      border-radius: 7px;
      margin-bottom: 15px;
    }

    .message.success {
      display: block;
      background: #d9f7df;
      color: #137333;
    }

    .message.error {
      display: block;
      background: #fce8e6;
      color: #c5221f;
    }

    .record-count {
      color: #777;
      font-size: 14px;
    }

    @media (max-width: 700px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-group.full {
        grid-column: auto;
      }

      .toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      .search {
        width: 100%;
      }

      .buttons {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>CRUD Management System</h1>
    <p>Google Apps Script + Google Sheets</p>
  </div>

  <div id="message" class="message"></div>

  <!-- FORM -->
  <div class="card">

    <h2 id="formTitle">Add Record</h2>

    <form id="recordForm">

      <input type="hidden" id="recordId">

      <div class="form-grid">

        <div class="form-group">
          <label for="name">Name *</label>
          <input
            type="text"
            id="name"
            placeholder="Enter name"
            required
          >
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            placeholder="Enter email"
          >
        </div>

        <div class="form-group">
          <label for="phone">Phone</label>
          <input
            type="text"
            id="phone"
            placeholder="Enter phone"
          >
        </div>

        <div class="form-group">
          <label for="status">Status</label>

          <select id="status">
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
            <option value="Pending">Pending</option>
          </select>

        </div>

      </div>

      <div class="buttons">

        <button
          type="submit"
          class="btn-primary"
          id="submitButton"
        >
          Add Record
        </button>

        <button
          type="button"
          class="btn-secondary"
          onclick="resetForm()"
        >
          Clear
        </button>

      </div>

    </form>

  </div>


  <!-- TABLE -->
  <div class="card">

    <div class="toolbar">

      <div>
        <h2>Records</h2>
        <span id="recordCount" class="record-count">
          Loading...
        </span>
      </div>

      <input
        type="text"
        id="search"
        class="search"
        placeholder="Search records..."
        oninput="filterRecords()"
      >

    </div>

    <div class="table-container">

      <table>

        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Status</th>
            <th>Created</th>
            <th>Updated</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="tableBody">

          <tr>
            <td colspan="7" class="loading">
              Loading records...
            </td>
          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>


<script>

  let records = [];
  let editingId = null;


  /**
   * Load records when page opens.
   */
  document.addEventListener('DOMContentLoaded', function() {
    loadRecords();
  });


  /**
   * READ
   */
  function loadRecords() {

    document.getElementById('tableBody').innerHTML = `
      <tr>
        <td colspan="7" class="loading">
          Loading records...
        </td>
      </tr>
    `;

    google.script.run
      .withSuccessHandler(function(data) {

        records = data || [];

        renderTable(records);

      })
      .withFailureHandler(function(error) {

        showMessage(
          error.message || 'Failed to load records.',
          'error'
        );

      })
      .getRecords();

  }


  /**
   * Render table.
   */
  function renderTable(data) {

    const tbody = document.getElementById('tableBody');

    document.getElementById('recordCount').textContent =
      `${data.length} record${data.length === 1 ? '' : 's'}`;

    if (data.length === 0) {

      tbody.innerHTML = `
        <tr>
          <td colspan="7" class="empty">
            No records found.
          </td>
        </tr>
      `;

      return;
    }


    tbody.innerHTML = data.map(function(record) {

      const statusClass =
        record.status.toLowerCase() === 'active'
          ? 'status-active'
          : record.status.toLowerCase() === 'inactive'
            ? 'status-inactive'
            : 'status-pending';


      return `
        <tr>

          <td>${escapeHtml(record.name)}</td>

          <td>${escapeHtml(record.email)}</td>

          <td>${escapeHtml(record.phone)}</td>

          <td>
            <span class="status ${statusClass}">
              ${escapeHtml(record.status)}
            </span>
          </td>

          <td>${escapeHtml(record.createdAt)}</td>

          <td>${escapeHtml(record.updatedAt)}</td>

          <td>
            <div class="actions">

              <button
                class="btn-edit"
                onclick="editRecord('${record.id}')"
              >
                Edit
              </button>

              <button
                class="btn-delete"
                onclick="deleteRecord('${record.id}')"
              >
                Delete
              </button>

            </div>
          </td>

        </tr>
      `;

    }).join('');

  }


  /**
   * CREATE / UPDATE
   */
  document.getElementById('recordForm')
    .addEventListener('submit', function(event) {

      event.preventDefault();

      const data = {

        id: document.getElementById('recordId').value,

        name: document.getElementById('name').value,

        email: document.getElementById('email').value,

        phone: document.getElementById('phone').value,

        status: document.getElementById('status').value

      };


      const submitButton =
        document.getElementById('submitButton');

      submitButton.disabled = true;


      if (editingId) {

        // UPDATE

        google.script.run
          .withSuccessHandler(function(response) {

            showMessage(
              response.message,
              'success'
            );

            resetForm();
            loadRecords();

            submitButton.disabled = false;

          })
          .withFailureHandler(function(error) {

            showMessage(
              error.message || 'Failed to update record.',
              'error'
            );

            submitButton.disabled = false;

          })
          .updateRecord(data);


      } else {

        // CREATE

        google.script.run
          .withSuccessHandler(function(response) {

            showMessage(
              response.message,
              'success'
            );

            resetForm();
            loadRecords();

            submitButton.disabled = false;

          })
          .withFailureHandler(function(error) {

            showMessage(
              error.message || 'Failed to create record.',
              'error'
            );

            submitButton.disabled = false;

          })
          .createRecord(data);

      }

    });


  /**
   * EDIT
   */
  function editRecord(id) {

    const record = records.find(function(item) {
      return item.id === id;
    });

    if (!record) {
      showMessage('Record not found.', 'error');
      return;
    }


    editingId = record.id;

    document.getElementById('recordId').value =
      record.id;

    document.getElementById('name').value =
      record.name;

    document.getElementById('email').value =
      record.email;

    document.getElementById('phone').value =
      record.phone;

    document.getElementById('status').value =
      record.status || 'Active';


    document.getElementById('formTitle').textContent =
      'Edit Record';

    document.getElementById('submitButton').textContent =
      'Update Record';


    window.scrollTo({
      top: 0,
      behavior: 'smooth'
    });

  }


  /**
   * DELETE
   */
  function deleteRecord(id) {

    const record = records.find(function(item) {
      return item.id === id;
    });

    if (!record) {
      showMessage('Record not found.', 'error');
      return;
    }


    const confirmed = confirm(
      `Are you sure you want to delete "${record.name}"?`
    );

    if (!confirmed) {
      return;
    }


    google.script.run
      .withSuccessHandler(function(response) {

        showMessage(
          response.message,
          'success'
        );

        loadRecords();

      })
      .withFailureHandler(function(error) {

        showMessage(
          error.message || 'Failed to delete record.',
          'error'
        );

      })
      .deleteRecord(id);

  }


  /**
   * SEARCH
   */
  function filterRecords() {

    const search =
      document.getElementById('search')
        .value
        .toLowerCase()
        .trim();


    if (!search) {
      renderTable(records);
      return;
    }


    const filtered = records.filter(function(record) {

      return (
        record.name.toLowerCase().includes(search) ||
        record.email.toLowerCase().includes(search) ||
        record.phone.toLowerCase().includes(search) ||
        record.status.toLowerCase().includes(search)
      );

    });


    renderTable(filtered);

  }


  /**
   * Reset form.
   */
  function resetForm() {

    editingId = null;

    document.getElementById('recordForm').reset();

    document.getElementById('recordId').value = '';

    document.getElementById('status').value = 'Active';

    document.getElementById('formTitle').textContent =
      'Add Record';

    document.getElementById('submitButton').textContent =
      'Add Record';

  }


  /**
   * Show notification.
   */
  function showMessage(message, type) {

    const element =
      document.getElementById('message');

    element.textContent = message;

    element.className =
      `message ${type}`;


    setTimeout(function() {

      element.className = 'message';

    }, 4000);

  }


  /**
   * Prevent HTML injection.
   */
  function escapeHtml(value) {

    return String(value || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');

  }

</script>

</body>
</html>
